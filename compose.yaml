name: aishield
x-app: &app
  image: ${BACKEND_IMAGE:-shield:local}
  env_file: ${RUNTIME_ENV_FILE:-.env}
  restart: unless-stopped
  init: true
  stop_grace_period: 135s
  logging: &logs
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
  volumes:
    - recordings:/data/uploads
    - ${MODEL_ASSET_DIR:-./assets/models}/toxicity:/models/toxicity:ro
    - ${MODEL_ASSET_DIR:-./assets/models}/voice_model:/models/voice_model:ro
    - ${MODEL_ASSET_DIR:-./assets/models}/scream_model:/models/scream_model:ro
    - ${MODEL_ASSET_DIR:-./assets/models}/vosk-model-small-en-in-0.4:/models/vosk-model-small-en-in-0.4:ro
  networks: [backend]
  security_opt: [no-new-privileges:true]
  healthcheck: &api-health
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=10)"]
    interval: 20s
    timeout: 12s
    retries: 3
    start_period: 90s
services:
  api1:
    <<: *app
    build: .
    environment: {INSTANCE_ID: api1}
  api2:
    <<: *app
    environment: {INSTANCE_ID: api2}
  worker:
    <<: *app
    command: [celery, -A, 'app.alerts:celery', worker, --loglevel=WARNING, --concurrency=2, '--hostname=worker@%h']
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.alerts:celery inspect ping --destination worker@$$HOSTNAME --timeout 3 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 3
  dispatcher:
    <<: *app
    command: [python, -m, app.alerts]
    healthcheck:
      test: [CMD, python, scripts/check_dispatcher.py]
      interval: 20s
      timeout: 12s
      retries: 3
  migrate:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: [python, -m, app.migrate]
    healthcheck: {disable: true}
  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [backend]
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health/live']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis-data:/data]
    networks: [backend]
    logging: *logs
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16.8-alpine
    env_file: ${RUNTIME_ENV_FILE:-.env}
    restart: unless-stopped
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  backend:
volumes:
  postgres-data:
  recordings:
  redis-data:
