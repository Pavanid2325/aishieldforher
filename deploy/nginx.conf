events { worker_connections 1024; }
http {
    # Docker embedded DNS; resolve tracks recreated API containers (nginx >=1.27.3).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream shield {
        zone shield 64k;
        server api1:5000 resolve max_fails=2 fail_timeout=10s;
        server api2:5000 resolve max_fails=2 fail_timeout=10s;
    }
    log_format safe '$request_method $uri $status';
    access_log /dev/stdout safe;
    error_log /dev/stderr crit;
    server {
        listen 80;
        client_max_body_size 10m;
        client_body_timeout 30s;
        location / {
            proxy_pass http://shield;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 130s;
            proxy_send_timeout 130s;
            # Do not replay a POST after it may have committed.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
