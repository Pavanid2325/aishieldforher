name: Test, build and deploy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.8-alpine
        env: {POSTGRES_USER: shield, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: shield_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U shield -d shield_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://shield:ci-only@localhost:5432/shield_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      FAKE_INFERENCE: 'true'
      ALERT_PROVIDER: fake
      ALERTS_ENABLED: 'true'
      RUN_INTEGRATION: 'true'
      RUN_REDIS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-test.txt pip-audit==2.9.0
      - run: python -m pytest -q
      # Dependency vulnerabilities block releases; exceptions require reviewed policy changes.
      - run: pip-audit -r requirements.txt
      - name: Compose integration and image validation
        run: |
          cp .env.example .env.local
          echo 'FAKE_INFERENCE=true' >> .env.local
          export RUNTIME_ENV_FILE=.env.local
          bash scripts/compose-check.sh
      - name: Container vulnerabilities (fixable HIGH and CRITICAL block)
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/reports -v trivy-cache:/root/.cache \
              aquasec/trivy:0.61.1 "$@"
          }
          scan image --scanners vuln --timeout 15m --no-progress --format json --output /reports/container-scan.json shield:local
          scan image --scanners vuln --timeout 15m --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed shield:local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: container-vulnerability-report, path: /tmp/container-scan.json, retention-days: 14}
      - run: docker save shield:local -o /tmp/backend.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: backend-image, path: /tmp/backend.tar, retention-days: 2}
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment: production
    concurrency: {group: aishield-production, cancel-in-progress: false}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: backend-image, path: /tmp}
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish validated image and deploy via SSM
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          docker load -i /tmp/backend.tar
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null
          docker tag shield:local "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          image="$REGISTRY/$REPOSITORY@$digest"
          # Deployment bundle is copied from the very image that passed validation.
          python - "$image" "$GITHUB_SHA" <<'PY'
          import json,sys
          image,sha=sys.argv[1:]
          commands=['set -eu', 'cd /opt/aishield',
            'aws ecr get-login-password | docker login --username AWS --password-stdin '+image.split('/')[0]+' >/dev/null',
            'docker pull '+image,
            'cid=$(docker create '+image+')',
            'docker cp "$cid:/app/deploy/." /opt/aishield/deploy/',
            'docker cp "$cid:/app/scripts/." /opt/aishield/scripts/',
            'docker cp "$cid:/app/compose.yaml" /opt/aishield/compose.yaml',
            'docker cp "$cid:/app/compose.production.yaml" /opt/aishield/compose.production.yaml',
            'docker rm "$cid"', 'bash scripts/deploy.sh '+image+' '+sha]
          with open('/tmp/ssm.json','w') as f: json.dump({'commands':commands,'executionTimeout':['900']},f)
          PY
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters file:///tmp/ssm.json --query Command.CommandId --output text)
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text)
            case "$status" in
              Success) exit 0;;
              Failed|Cancelled|TimedOut) echo "Deployment $status; inspect protected SSM output"; exit 1;;
            esac
            sleep 10
          done
          echo 'Deployment timed out'; exit 1
